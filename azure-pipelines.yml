# A permitted, existing Azure Resource Manager connection must be supplied.
# Do not create service principals in the Udacity shared training subscription.
# Set these non-secret Azure DevOps pipeline variables before importing:
# azureServiceConnection, webAppName and the actual webAppUrl.
trigger:
  branches:
    include: [main, master]
pr:
  branches:
    include: [main, master]
variables:
  pythonVersion: '3.12'
stages:
  - stage: Build
    jobs:
      - job: TestAndPackage
        pool:
          vmImage: ubuntu-24.04
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
          - script: make all
            displayName: Install, lint, test and package
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '$(System.DefaultWorkingDirectory)/test-results/junit.xml'
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true
              failTaskOnFailureToPublishResults: true
          - publish: dist/app.zip
            artifact: app-source
  - stage: Deploy
    dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))
    jobs:
      - deployment: AppService
        pool:
          vmImage: ubuntu-24.04
        environment: nd082-training
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: app-source
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: webAppLinux
                    appName: '$(webAppName)'
                    package: '$(Pipeline.Workspace)/app-source/app.zip'
                    runtimeStack: 'PYTHON|3.12'
                    startUpCommand: 'gunicorn --bind=0.0.0.0:8000 --workers 2 --timeout 120 --access-logfile - --error-logfile - app:app'
                - script: python scripts/predict.py "$WEB_APP_URL"
                  displayName: Deployment prediction smoke test
                  env:
                    WEB_APP_URL: '$(webAppUrl)'
